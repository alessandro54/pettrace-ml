[project]
name = "pettrace-ml"
version = "0.1.0"
description = "PetTrace re-identification experiments: evaluation harness, model registration, notebooks and reports"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11,<3.12"
dependencies = [
    # Same versions the PetTrace vision service serves with (apps/vision/pyproject.toml).
    "numpy>=1.26,<3",
    "pillow==11.0.0",
    "pyyaml>=6,<7",
    "onnxruntime==1.20.1",
    "mlflow-skinny==3.16.1",
    "huggingface-hub>=0.26,<1",
    "requests>=2.32,<3",
]

[dependency-groups]
figures = ["matplotlib>=3.9,<4"]
# Execute the experiment notebooks (make notebook).
notebooks = ["nbconvert>=7.16,<8", "ipykernel>=6.29,<7", "nbformat>=5.10,<6"]
# Model export / registration only (register_v1.py, reid.clip_reference). Not needed to evaluate.
export = [
    "torch==2.5.1",
    "transformers==4.47.1",
    "onnx==1.17.0",
]
dev = [
    "pytest==8.3.4",
    "ruff==0.8.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["reid"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["reid"]
