[project]
name = "pettrace-ml"
version = "0.2.3"
description = "PetTrace re-identification experiments: evaluation harness, model registration, notebooks and reports"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11,<3.14"
dependencies = [
    # Compatible runtime dependencies; uv.lock pins the local/Docker environment.
    "numpy>=1.26,<3",
    "pillow==12.3.0",
    "pyyaml>=6,<7",
    "onnxruntime==1.31.0",
    "mlflow-skinny==3.17.0",
    "huggingface-hub>=0.26,<3",
    "requests>=2.32,<3",
]

[project.optional-dependencies]
notebooks = ["matplotlib>=3.9,<4", "ipython>=8,<10", "ipywidgets>=8.1,<9", "pip>=25,<27"]
training = ["torch>=2.5,<3", "onnx>=1.17,<2", "pandas>=2.2.3,<4"]

[project.scripts]
pettrace-evaluate = "pettrace.cli:main"
pettrace-prepare-e3 = "pettrace.data.preparation:main"

[dependency-groups]
figures = ["matplotlib>=3.9,<4"]
# Execute the experiment notebooks (make notebook).
notebooks = ["nbconvert>=7.16,<8", "ipykernel>=6.29,<7", "nbformat>=5.10,<6"]
# Model export / registration only (register_v1.py, pettrace.models.clip_reference). Not needed to evaluate.
export = [
    "torch==2.5.1",
    "transformers==4.47.1",
    "onnx==1.17.0",
]
dev = [
    "pytest==8.3.4",
    "ruff==0.8.4",
]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build]
artifacts = ["src/pettrace/_build.json"]

[tool.hatch.build.targets.wheel]
packages = ["src/pettrace"]

[tool.hatch.build.targets.sdist]
include = ["/src/pettrace", "/pyproject.toml", "/uv.lock", "/.python-version", "/README.md", "/LICENSE", "/docs/releases.md"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["notebooks", "datasets/*.ipynb"]

[tool.ruff.lint]
select = ["E", "F"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
