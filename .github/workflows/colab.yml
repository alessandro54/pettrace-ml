name: Colab runtime

on:
  workflow_call:
    inputs:
      artifact-name:
        type: string
        default: ""

permissions:
  contents: read

jobs:
  package-smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13.18"
          architecture: x64
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.22"
      - if: inputs.artifact-name == ''
        run: uv build --out-dir dist
      - if: inputs.artifact-name != ''
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.artifact-name }}
          path: dist
      - name: Install normally in Colab's Python version
        run: |
          python -m venv .colab-venv
          .colab-venv/bin/python -m pip install --report .colab-install.json dist/*.whl
          .colab-venv/bin/python -m pip check
          .colab-venv/bin/python -I -c "import sys, pettrace; assert sys.version_info[:3] == (3, 13, 18); assert 'site-packages' in pettrace.__file__"
      - name: Exercise immutable dataset loaders
        run: |
          .colab-venv/bin/python -m pip install 'pytest==8.3.4' 'ipython>=7.34,<10'
          .colab-venv/bin/python -m pytest -q \
            tests/unit/pettrace/data/test_benchmark.py \
            tests/unit/pettrace/data/test_refined_sources.py \
            tests/unit/pettrace/data/test_snapshots.py
      - name: Preserve Colab's preloaded Pillow
        run: |
          python -m venv .colab-preloaded
          .colab-preloaded/bin/python -m pip install 'pillow==11.3.0'
          WHEEL=$(find dist -name '*.whl' -print -quit) .colab-preloaded/bin/python - <<'PY'
          import os, subprocess, sys
          import PIL._typing
          subprocess.check_call([sys.executable, "-m", "pip", "install", os.environ["WHEEL"]])
          from PIL import ImageDraw
          assert ImageDraw
          PY
