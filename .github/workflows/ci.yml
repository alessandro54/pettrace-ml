name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.22"
      - run: uv sync --locked --group dev --group notebooks --extra notebooks --extra training
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync python -m pytest -q
      - run: uv build
      - name: Check installed wheel outside the checkout
        run: |
          uv pip install --python .venv/bin/python --reinstall --no-deps dist/*.whl
          PACKAGE_PYTHON="$PWD/.venv/bin/python"
          cd /tmp
          "$PACKAGE_PYTHON" -c "import pettrace; from pettrace.training.triplet import Config; from pettrace.data.preparation import PrepareConfig; assert 'site-packages' in pettrace.__file__"
